[workspace]
resolver = "2"
members = [
    "crates/ferncad-core",
    "crates/ferncad-cad",
    "crates/ferncad-wasm",
    "crates/ferncad-cli",
]

[workspace.dependencies]
# パーサー
logos = "0.16"

# ユーティリティ
thiserror = "2"
ordered-float = "5"

# CAD カーネル (truck)
truck-modeling = "0.6"
truck-topology = "0.6"
truck-polymesh = "0.6"
truck-meshalgo = "0.4"
truck-shapeops = "0.4"
truck-stepio = "0.3"

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
