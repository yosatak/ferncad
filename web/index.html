<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ferncad — Lisp CAD Modeler</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <h1>ferncad</h1>
      <div id="toolbar-actions">
        <button id="btn-evaluate" title="Evaluate (Ctrl+Enter)">▶ Run</button>
        <button id="btn-export-stl" title="Export STL">STL</button>
        <button id="btn-export-step" title="Export STEP (exact geometry)">STEP</button>
        <button id="btn-save" title="Save model">Save</button>
        <button id="btn-load" title="Load model">Load</button>
      </div>
    </header>
    <main id="workspace">
      <div id="editor-panel">
        <div id="editor-container"></div>
        <div id="status-bar"></div>
      </div>
      <div id="viewer-panel">
        <div id="assembly-tree"></div>
        <canvas id="viewer-canvas"></canvas>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
